<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Sea Side — отдых с бассейном</title>
<meta name="description" content="Частный дом с бассейном в Махинджаури, Грузия. 6 уютных номеров, общая кухня.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&family=Noto+Sans+Georgian:wght@300;400;500;600&family=Noto+Serif+Georgian:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>

<header class="nav" id="nav">
  <a href="#top" class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 15 16 5l12 10M7 13v14h18V13M13 27v-7h6v7"/><path d="M2 30c3-2 5-2 7 0s5 2 7 0 5-2 7 0 5 2 7 0" stroke-width="1.2"/></svg>
    <span><b>VILLA</b> SEA SIDE</span>
  </a>
  <nav class="links" id="links">
    <a href="#rooms" data-i18n="nav_rooms"></a>
    <a href="#glamping" data-i18n="nav_glamp"></a>
    <a href="#pool" data-i18n="nav_pool"></a>
    <a href="#house" data-i18n="nav_house"></a>
    <a href="#gallery" data-i18n="nav_gallery"></a>
    <a href="#location" data-i18n="nav_location"></a>
    <a href="#contact" data-i18n="nav_contact"></a>
  </nav>
  <div class="nav-right">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ka" title="ქართული" aria-label="ქართული">
        <svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice"><rect width="30" height="20" fill="#fff"/><path fill="#e8112d" d="M13 0h4v20h-4zM0 8h30v4H0zM5 2.500h3v1H5zM6 1.500h1v3H6zM22 2.500h3v1h-3zM23 1.500h1v3h-1zM5 14.500h3v1H5zM6 13.500h1v3H6zM22 14.500h3v1h-3zM23 13.500h1v3h-1z"/></svg>
      </button>
      <button data-lang="ru" title="Русский" aria-label="Русский">
        <svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice"><rect width="30" height="20" fill="#fff"/><rect y="6.670" width="30" height="6.670" fill="#0039a6"/><rect y="13.330" width="30" height="6.670" fill="#d52b1e"/></svg>
      </button>
      <button data-lang="en" title="English" aria-label="English">
        <svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><rect width="60" height="40" fill="#012169"/><path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0l60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="13"/><path d="M30 0v40M0 20h60" stroke="#c8102e" stroke-width="8"/></svg>
      </button>
    </div>
    <a class="btn btn-gold btn-sm call-link" data-i18n="call"></a>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
  </div>
</header>

<!-- HERO -->
<section class="hero" id="top">
  <div class="ph hero-bg"><picture><source media="(max-width:700px)" srcset="photos/hero-mobile.jpg"><img src="photos/hero.jpg" alt="" onerror="this.remove()"></picture></div>
  <div class="hero-shade"></div>
  <div class="hero-inner">
    <p class="eyebrow" data-i18n="hero_eyebrow"></p>
    <h1><span data-i18n="hero_t1"></span><br><em data-i18n="hero_t2"></em></h1>
    <p class="lead" data-i18n="hero_lead"></p>
    <div class="hero-cta">
      <a href="#rooms" class="btn btn-gold" data-i18n="hero_btn1"></a>
      <a class="btn btn-ghost wa-link" target="_blank" rel="noopener" data-i18n="write"></a>
    </div>
  </div>

  <form class="booking" id="bookingForm">
    <label><span data-i18n="b_in"></span><input type="date" id="bIn"></label>
    <label><span data-i18n="b_out"></span><input type="date" id="bOut"></label>
    <label><span data-i18n="b_guests"></span>
      <select id="bGuests"></select>
    </label>
    <button class="btn btn-gold" type="submit" data-i18n="b_send"></button>
  </form>
</section>

<!-- FACTS -->
<section class="facts reveal">
  <div><b>6</b><span data-i18n="f_rooms"></span></div>
  <div><b>🏊</b><span data-i18n="f_pool"></span></div>
  <div><b data-i18n="f_sea_v"></b><span data-i18n="f_sea"></span></div>
  <div><b>📶</b><span data-i18n="f_wifi"></span></div>
  <div><b>🅿️</b><span data-i18n="f_parking"></span></div>
  <div><b>🍳</b><span data-i18n="f_kitchen"></span></div>
</section>

<!-- ROOMS -->
<section class="section" id="rooms">
  <div class="head reveal">
    <p class="eyebrow" data-i18n="rooms_eyebrow"></p>
    <h2 data-i18n="rooms_title"></h2>
    <p class="sub" data-i18n="rooms_sub"></p>
    <p class="inroom" data-i18n="inroom"></p>
    <ul class="amen">
      <li><i>🚿</i><span data-i18n="am_bath"></span></li>
      <li><i>📺</i><span data-i18n="am_tv"></span></li>
      <li><i>🧊</i><span data-i18n="am_fridge"></span></li>
      <li><i>❄️</i><span data-i18n="am_ac"></span></li>
    </ul>
  </div>
  <div class="rooms" id="roomsGrid"></div>
</section>

<!-- GLAMPING -->
<section class="section" id="glamping">
  <div class="head reveal">
    <p class="eyebrow" data-i18n="gl_eyebrow"></p>
    <h2 data-i18n="gl_title"></h2>
    <p class="sub" data-i18n="gl_sub"></p>
  </div>
  <div class="gl-grid reveal">
    <div class="ph" data-photo="photos/glamping-1.jpg"><img src="photos/glamping-1.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="ph" data-photo="photos/glamping-2.jpg"><img src="photos/glamping-2.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="ph" data-photo="photos/glamping-3.jpg"><img src="photos/glamping-3.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="ph" data-photo="photos/glamping-5.jpg"><img src="photos/glamping-5.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="ph" data-photo="photos/glamping-4.jpg"><img src="photos/glamping-4.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="ph" data-photo="photos/glamping-6.jpg"><img src="photos/glamping-6.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="ph" data-photo="photos/glamping-8.jpg"><img src="photos/glamping-8.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="ph" data-photo="photos/yard-1.jpg"><img src="photos/yard-1.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
  </div>
  <ul class="amen reveal" id="glAmen"></ul>
  <div class="rooms gl-cards" id="glCards"></div>
</section>

<!-- POOL -->
<section class="split" id="pool">
  <div class="split-img reveal">
    <div class="ph tall"><img src="photos/pool-1.jpg" alt="" onerror="this.remove()"></div>
    <div class="ph small"><img src="photos/pool-2.jpg" alt="" onerror="this.remove()"></div>
  </div>
  <div class="split-text reveal">
    <p class="eyebrow" data-i18n="pool_eyebrow"></p>
    <h2 data-i18n="pool_title"></h2>
    <p data-i18n="pool_text"></p>
    <ul class="ticks">
      <li data-i18n="pool_l1"></li>
      <li data-i18n="pool_l2"></li>
      <li data-i18n="pool_l3"></li>
    </ul>
  </div>
</section>

<!-- HOUSE / KITCHEN -->
<section class="split rev" id="house">
  <div class="split-text reveal">
    <p class="eyebrow" data-i18n="house_eyebrow"></p>
    <h2 data-i18n="house_title"></h2>
    <p data-i18n="house_text"></p>
    <ul class="ticks">
      <li data-i18n="k_l1"></li><li data-i18n="k_l2"></li><li data-i18n="k_l3"></li><li data-i18n="k_l4"></li>
    </ul>
    <div class="floors">
      <div><h4 data-i18n="floor2"></h4><p data-i18n="floor2_t"></p></div>
      <div><h4 data-i18n="floor1"></h4><p data-i18n="floor1_t"></p></div>
    </div>
  </div>
  <div class="split-img reveal">
    <div class="ph tall"><img src="photos/kitchen.jpg" alt="" onerror="this.remove()"></div>
    <div class="ph small"><img src="photos/house.jpg" alt="" onerror="this.remove()"></div>
  </div>
</section>

<!-- GALLERY -->
<section class="section" id="gallery">
  <div class="head reveal">
    <p class="eyebrow" data-i18n="gal_eyebrow"></p>
    <h2 data-i18n="gal_title"></h2>
  </div>
  <div class="gallery reveal" id="galleryGrid"></div>
</section>

<!-- LOCATION -->
<section class="section" id="location">
  <div class="head reveal">
    <p class="eyebrow" data-i18n="loc_eyebrow"></p>
    <h2 data-i18n="loc_title"></h2>
    <p class="sub" data-i18n="loc_sub"></p>
  </div>
  <div class="map reveal">
    <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map"
      src="https://www.google.com/maps?q=Makhinjauri,+Georgia&output=embed"></iframe>
  </div>
</section>

<!-- CONTACT -->
<section class="contact" id="contact">
  <div class="reveal">
    <p class="eyebrow" data-i18n="c_eyebrow"></p>
    <h2 data-i18n="c_title"></h2>
    <p class="sub" data-i18n="c_sub"></p>
    <div class="contact-btns">
      <a class="btn btn-gold call-link"><span data-i18n="call"></span> <small class="phone-txt"></small></a>
      <a class="btn btn-wa wa-link" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <div class="socials"><a class="soc ig-link" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></a><a class="soc fb-link" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.600c0-.9.3-1.500 1.600-1.500h1.500V4.400c-.3 0-1.200-.1-2.200-.1-2.300 0-3.900 1.400-3.900 4v2.200H7.900v3h2.600V21z"/></svg></a></div>
  </div>
</section>

<footer>
  <span>© <span id="year"></span> Villa Sea Side</span>
  <span class="socials"><a class="soc ig-link" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></a><a class="soc fb-link" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.600c0-.9.3-1.500 1.600-1.500h1.500V4.400c-.3 0-1.200-.1-2.200-.1-2.300 0-3.900 1.400-3.900 4v2.200H7.900v3h2.600V21z"/></svg></a></span>
  <span data-i18n="foot"></span>
</footer>

<!-- floating contact buttons -->
<div class="fab">
  <a class="fab-btn fab-wa wa-link" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.100-1 .2-3.200-.7-2.700-1.100-4.400-3.800-4.600-4-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.3.400-.4.400c-.1.100-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.100.100.1.600-.1 1.200Z"/></svg>
  </a>
  <a class="fab-btn fab-call call-link" aria-label="Call">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.600 10.800a15 15 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25 11.400 11.400 0 0 0 3.600.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.300.2 2.500.6 3.600a1 1 0 0 1-.25 1Z"/></svg>
  </a>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Prev">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
</div>

<script src="script.js?v=21"></script>
</body>
</html>
